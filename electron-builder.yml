# Baut das Mac-Programm „Starkmacher“.
#   npm run paket → release/mac-arm64/Starkmacher.app
#
# Keine kostenpflichtige Apple-Signatur (Apple Developer Program, 99 €/Jahr).
# Das Programm wird nur „ad hoc“ signiert (scripts/ad-hoc-signieren.cjs). Auf
# diesem Mac gebaut, startet es ohne Rückfrage.
appId: de.lukas.starkmacher
productName: Starkmacher
copyright: Lukas
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Der Grundbestand (npm run bls), außerhalb des Archivs, damit SQLite ihn direkt lesen kann.
extraResources:
  - from: ressourcen/bls-4.0.sqlite
    to: bls-4.0.sqlite
  # Offline-Kopie von Open Food Facts, nur deutsche Produkte (npm run off).
  - from: ressourcen/openfoodfacts-de.sqlite
    to: openfoodfacts-de.sqlite
  # Liest Text und Barcodes aus Fotos, auf dem Mac (npm run sehen).
  - from: ressourcen/starkmacher-sehen
    to: starkmacher-sehen
mac:
  category: public.app-category.healthcare-fitness
  icon: build/icon.png
  identity: null
  target:
    - target: dmg
      arch: [arm64]
  extendInfo:
    CFBundleDevelopmentRegion: de
    LSApplicationCategoryType: public.app-category.healthcare-fitness
afterPack: scripts/ad-hoc-signieren.cjs
dmg:
  title: Starkmacher
